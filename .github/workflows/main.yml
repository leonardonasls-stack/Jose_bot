name: Telegram Bot Workflow

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  # Permite rodar o workflow manualmente pela aba Actions
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4
      
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        # Instala as dependências lendo do requirements.txt
        # Se você ainda não tem esse arquivo, o comando abaixo cria um temporário
        if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install python-telegram-bot supabase httpx python-dotenv; fi

    - name: Verificar erros de sintaxe
      run: |
        # Verifica se o código tem erros graves sem rodar o bot
        python -m py_compile src/main.py
        
    # ATENÇÃO: Se a sua intenção é HOSPEDAR o bot usando o GitHub Actions,
    # você pode descomentar o passo abaixo, mas lembre-se:
    # 1. O GitHub Actions derruba qualquer processo que passe de 6 horas de execução.
    # 2. Você precisará cadastrar as variáveis TELEGRAM_BOT_TOKEN e SUPABASE_URL / KEY nos "Secrets" do repositório.
    
    # - name: Rodar o Bot
    #   env:
    #     TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    #     SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    #     SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    #   run: |
    #     python src/main.py
